name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check app scripts tests dashboard

      - name: Format check
        run: uv run black --check app scripts tests dashboard

      - name: Type check
        run: uv run mypy app scripts dashboard

      - name: Run tests
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=50 -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t m5-api .

      - name: Build dashboard image
        run: docker build -f docker/Dockerfile.dashboard -t m5-dashboard .
